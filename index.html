const DEF={emp:[],imap:{},photos:[],av:[],lb:0,lbz:"",po:[],ag:{},agl:["Temper","Nowjob"],einit:true,st:{n:"Esso Neerduist",a:"rijksweg a1 nr 3",p:"3821 CH Amersfoort"},mp:{},s3init:false,s2init:false,sinit:false,tinit:false,ot:[],oinit:false,cinit:false,rep:{},ea:{p:[],o:[]},sp:{t:"SPAR Actie",d:"",e:"",items:[]},gf:{t:"Go Fresh menu",d:"",e:"",items:[],notes:[]},sb:{t:"SPAR Bakery menu",d:"",e:"",items:[],notes:[]},bk:"gofresh",vp:[],roster:{},abs:{},todo:[],logs:[],counts:[],visits:[],office:[],notes:[],spar:[],info:""};

 todo:{t:"To Do",f:[["t","Titel"],["b","Omschrijving","area"],["p","Prioriteit","select",["Hoog","Normaal","Laag"]],["r","Herhalen","select",REP],["u","Onderwerp"]]},

};
let S=JSON.parse(JSON.stringify(DEF)),tab="home",view=null,day=iso(new Date()),db=null,ref=null,tm=null,lastJson="";
const $=q=>document.querySelector(q);
function iso(d){const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)}
function fromIso(s){return new Date(s+"T12:00:00")}
function wk(d){d=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-n);return Math.ceil(((d-Date.UTC(d.getUTCFullYear(),0,1))/864e5+1)/7)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function fd(s){return s?fromIso(s).toLocaleDateString("nl-NL",{weekday:"short",day:"numeric",month:"short"}):""}
const uid=()=>Math.random().toString(36).slice(2,9);
function mon(){return iso(new Date()).slice(0,7)}

/* ---------- opslag ---------- */
function setSt(t){$("#st").textContent=t}
function merge(o){S=Object.assign(JSON.parse(JSON.stringify(DEF)),o||{});if(!S.cinit){if(!S.counts.length)S.counts=["Shop","Bakery","Tabak"].map(name=>({name,items:[]}));S.cinit=true}const GN=["Shop","Bakery","Tabak"];GN.forEach(n=>{if(!S.counts.some(g=>g.name===n))S.counts.push({name:n,items:[]})});S.counts.sort((a,b)=>{const i=GN.indexOf(a.name),j=GN.indexOf(b.name);return (i<0?9:i)-(j<0?9:j)});if(!S.sinit){const g=S.counts.find(x=>x.name==="Shop");if(g&&!g.items.length)g.items=SHOP.map(n=>({n,done:{}}));S.sinit=true}if(!S.s2init){const f=(n,l)=>{const g=S.counts.find(x=>x.name===n);if(g&&!g.items.length)g.items=l.map(n=>({n,done:{}}))};f("Bakery",BAK);f("Tabak",TAB);S.s2init=true}if(!S.s3init){[["Shop",SHOP],["Bakery",BAK],["Tabak",TAB]].forEach(([n,l])=>{const g=S.counts.find(x=>x.name===n);if(!g)return;l.forEach(x=>{if(!g.items.some(i=>i.n.toLowerCase()===x.toLowerCase()))g.items.push({n:x,done:{}})})});S.s3init=true}if(!S.oinit){if(!S.ot.length)S.ot=SEED.map((l,i)=>{const[n,a]=l.split("|");return{id:"s"+i,n,a,c:{w:"",d:""}}});S.oinit=true}if(!S.tinit){if(!S.todo.length)S.todo=DEFT();S.tinit=true}if(!S.einit){seedEmp();S.einit=true}bkMig()}
function save(){
 const j=JSON.stringify(S);lastJson=j;
 try{localStorage.setItem("egwork",j)}catch(e){}
 setSt("Opslaan…");clearTimeout(tm);
 tm=setTimeout(async()=>{
  if(!ref){setSt("Alleen op dit apparaat");return}
  try{await ref.set({json:j});setSt("✓ Opgeslagen")}catch(e){setSt("Niet gedeeld")}
 },500);
}
async function init(){
 try{const j=localStorage.getItem("egwork");if(j){merge(JSON.parse(j));lastJson=j}else merge({})}catch(e){merge({})}
 try{const th=localStorage.getItem("egtheme");if(th)document.documentElement.dataset.theme=th}catch(e){}
 render();
 try{
  db=await (window.claude&&claude.use?claude.use("db"):null);
  if(!db){setSt("Alleen op dit apparaat");return}
  ref=db.doc("eg/state");
  ref.onSnapshot(s=>{
   if(s.exists&&s.data().json){
    if(s.metadata.hasPendingWrites)return;
    const j=s.data().json;if(j===lastJson)return;
    lastJson=j;merge(JSON.parse(j));setSt("✓ Gedeeld");if(!$("#modal").classList.contains("on"))render();
   }else if(lastJson&&lastJson!==JSON.stringify(DEF)){save()}
   else setSt("✓ Gedeeld");
  },()=>setSt("Niet gedeeld"));
 }catch(e){setSt("Alleen op dit apparaat")}
}

/* ---------- modal ---------- */
function openM(h){$("#sheet").innerHTML=h;$("#modal").classList.add("on");if(typeof schedSync==="function")schedSync()}
function closeM(){$("#modal").classList.remove("on");if(typeof schedSync==="function")schedSync()}
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeM()});
function form(title,fields,init,cb,del){
 let h=`<h2>${esc(title)}</h2>`;
 fields.forEach(([k,l,t,o])=>{
  const v=init[k]||"";h+=`<label>${esc(l)}</label>`;
  if(t==="area")h+=`<textarea data-k="${k}" rows="4">${esc(v)}</textarea>`;
  else if(t==="date")h+=`<input type="date" data-k="${k}" value="${esc(v)}">`;
  else if(t==="select"||t==="emp"){const op=t==="emp"?["",...S.emp]:o;h+=`<select data-k="${k}">${op.map(x=>`<option ${x===v||(!v&&x==="Normaal"&&k==="p")?"selected":""}>${esc(x)}</option>`).join("")}</select>`}
  else h+=`<input type="text" data-k="${k}" value="${esc(v)}">`;
 });
 h+=`<div class="row" style="margin-top:16px">${del?'<button class="btn r" id="fd">Verwijderen</button>':"<span></span>"}<span><button class="btn g" id="fc">Annuleer</button> <button class="btn" id="fs">Opslaan</button></span></div>`;
 openM(h);
 $("#fc").onclick=closeM;
 if(del)$("#fd").onclick=()=>{ask("Weet je het zeker?",del)};
 $("#fs").onclick=()=>{const o={};document.querySelectorAll("#sheet [data-k]").forEach(e=>o[e.dataset.k]=e.value.trim());if(!(o[fields[0][0]]||"")){return}cb(o);closeM()};
}
function pick(title,opts){openM(`<h2>${esc(title)}</h2>`+opts.map((o,i)=>`<button class="btn ${o[2]||"g"}" style="display:block;width:100%;margin:8px 0" data-i="${i}">${esc(o[0])}</button>`).join(""));
 document.querySelectorAll("#sheet [data-i]").forEach(b=>b.onclick=()=>{closeM();opts[b.dataset.i][1]()})}

/* ---------- schermen ---------- */
function greet(){const h=new Date().getHours();return h<6?"Goedenacht":h<12?"Goedemorgen":h<18?"Goedemiddag":"Goedenavond"}
function working(d){const r=S.roster[d]||{};const s=new Set();SH.forEach(x=>(r[x]||[]).forEach(n=>s.add(n)));return s}
function rosterBody(d,ro){
 const r=S.roster[d]||{},a=S.abs[d]||{};
 return SH.map(s=>{const l=r[s]||[];if(ro&&!l.length)return"";
  return `<div style="margin-top:10px"><div class="row"><b>${s}</b>${ro?"":`<button class="btn g" data-add="${s}">+</button>`}</div>
  ${l.map(n=>`<span class="chip ${aOf(d,n)||""}" ${ro?"":`data-who="${s}|${esc(n)}"`}>${esc(n)}${agb(n)}${aOf(d,n)?" · "+aOf(d,n):""}</span>`).join("")||'<span class="mu">Niemand</span>'}</div>`}).join("")||'<div class="mu">Niemand ingepland.</div>';

const bfOpen=()=>{try{return localStorage.getItem("egbrief")==="1"}catch(e){return false}};
function brief(col){
 const n=iso(new Date()),R=rows(n),cm=mon(),hi=S.todo.filter(x=>!x.x&&x.p==="Hoog"),vp=S.vp[S.vp.length-1],ok=vp&&vp.slice(0,7)===cm;
 const op=!col||bfOpen(),nz=R.filter(r=>r.a==="ziek").length,no=S.todo.filter(x=>!x.x).length;
 if(!op)return `<div class="card big" data-a="bf" style="cursor:pointer"><div class="row"><b class="ct">Manager Briefing</b><b class="chv">⌄</b></div><div class="bl" style="margin-top:4px">👥 ${R.length} ingepland · 🤒 ${nz} ziek · 🟠 ${no} open taken${hi.length?` · 🔴 ${hi.length} hoog`:""}</div>${ok?"":'<div class="mu" style="font-size:12px;margin-top:4px">Villa Pardoes: nog niet afgeslagen deze maand</div>'}</div>`;
 return `<div class="card big">${col?'<div class="row" data-a="bf" style="cursor:pointer"><b class="ct">Manager Briefing</b><b class="chv up">⌄</b></div>':'<b class="ct">Manager Briefing</b>'}<div class="bl">👥 Vandaag: ${R.length} medewerkers ingepland<br>🟠 ${S.todo.filter(x=>!x.x).length} open taken<br>🔴 ${hi.length} hoge prioriteit<br>🤒 ${R.filter(r=>r.a==="ziek").length} ziek<br>🔄 ${R.filter(r=>r.r).length} vervanger${(()=>{const q=S.emp.filter(x=>avP(x,n)&&!R.some(r=>r.n===x));return q.length?"<br>🏖️ Afwezig: "+q.map(x=>esc(x)+" ("+avP(x,n).t.toLowerCase()+")").join(", "):""})()}<br>📦 Tellingen ${MN()}${S.counts.map(g=>`<br>${esc(g.name)}: ${vis(g,cm).filter(i=>(i.done||{})[cm]).length} / ${vis(g,cm).length} gereed`).join("")}${eaList().length?`<br>⚠️ Extra aandacht: ${eaList().map(esc).join(", ")}`:""}${visitBrief()}</div>
 <div class="vp" data-a="vp"><b>VILLA PARDOES</b><div class="mu" style="font-size:13px;margin-top:3px">${ok?"Laatst verwerkt: "+vp.split("-").reverse().join("-"):"Nog niet afgeslagen deze maand ›"}</div></div></div>`;
}

  lst("logs","Logboek",x=>[x.w,x.c&&fd(x.c),x.n].filter(Boolean).join(" · "));
  lst("notes","Notities");
  lst("visits","Bezoeken & afspraken",x=>[x.k,x.d&&fd(x.d),x.tm,x.n].filter(Boolean).join(" · "));

  add("office","Takenlijst kantoor",S.ot.filter(x=>m(x.n)).map(x=>({g:"office",t:x.n,s:""})));
  const ci=[];S.counts.forEach((g,gi)=>g.items.forEach(it=>{if(m(it.n,g.name))ci.push({g:"counts",i:gi,t:it.n,s:g.name})}));add("counts","Tellingen",ci);

function ensure(d,s){S.roster[d]=S.roster[d]||{};S.roster[d][s]=S.roster[d][s]||[]}
function grp(gi){
 const g=S.counts[gi],sel=(t,fn,c)=>g.items.length?pick(t,g.items.map((it,ii)=>[it.n,()=>fn(it,ii),c])):msg("Er zijn nog geen subcategorieën.");
 pick("Beheer – "+g.name,[
  ["Subcategorie toevoegen",()=>form("Nieuwe subcategorie",[["n","Naam"]],{},o=>{g.items.push({n:o.n,done:{}});save();render()})],
  ["Subcategorie hernoemen",()=>sel("Welke subcategorie hernoemen?",it=>form("Subcategorie hernoemen",[["n","Naam"]],it,o=>{rnSub(g,it,o.n);save();render()}))],
  ["Subcategorie verwijderen",()=>sel("Welke subcategorie verwijderen?",(it,ii)=>ask("Subcategorie "+it.n+" verwijderen?",()=>{g.items.splice(ii,1);save();render()}),"r")],
  ["Categorie toevoegen",()=>form("Nieuwe categorie",[["name","Naam"]],{},o=>{S.counts.push({name:o.name,items:[]});cG=S.counts.length-1;save();render()})],
  ["Categorie hernoemen",()=>form("Categorie hernoemen",[["name","Naam"]],g,o=>{mvG(g,o.name);save();render()})],
  ["Categorie verwijderen",()=>ask("Categorie "+g.name+" met alle subcategorieën verwijderen?",()=>{S.counts.splice(gi,1);save();render()}),"r"]]);
}
document.addEventListener("click",e=>{
 const t=e.target.closest("[data-tab],[data-go],[data-day],[data-set],[data-add],[data-who],[data-emp],[data-newemp],[data-ags],[data-edit],[data-new],[data-quick],[data-cc],[data-chk],[data-grp],[data-newgrp]");
 if(!t)return;const d=t.dataset;
 if(d.tab){tab=d.tab;view=null;render();scrollTo(0,0)}
 else if(d.go){view=d.go;render();scrollTo(0,0)}
 else if(d.day){const x=fromIso(day);x.setDate(x.getDate()+ +d.day);day=iso(x);render()}
 else if(d.set){day=d.set;render()}
 else if(d.add){const s=d.add;ensure(day,s);const free=S.emp.filter(n=>!S.roster[day][s].includes(n));
  if(!S.emp.length){msg("Voeg eerst medewerkers toe bij Team.");return}
  pick("Voeg toe aan "+s,free.slice().sort((x,y)=>(aOf(day,x)?1:0)-(aOf(day,y)?1:0)).map(n=>{const a=aOf(day,n);return [n+(a?" · "+a:""),()=>{S.roster[day][s].push(n);save();render()},a?"g":undefined]}))}
 else if(d.who){const[s,n]=d.who.split("|");S.abs[day]=S.abs[day]||{};
  pick(n,[["Ziek melden",()=>{S.abs[day][n]="ziek";save();render()}],["Vakantie",()=>{S.abs[day][n]="vakantie";save();render()}],["Aanwezig",()=>{if(avP(n,day))S.abs[day][n]="";else delete S.abs[day][n];save();render()}],["Van dienst halen",()=>{S.roster[day][s]=S.roster[day][s].filter(x=>x!==n);save();render()},"r"]])}
 else if(d.ags!==undefined)agMenu();
 else if(d.newemp!==undefined)form("Nieuwe medewerker",[["n","Naam"],["v","Via","select",AGS()]],{v:AGE},o=>{S.emp.push(o.n);if(o.v&&o.v!==AGE)S.ag[o.n]=o.v;save();render()});
 else if(d.emp!==undefined){const i=+d.emp;{const old=S.emp[i];form("Medewerker",[["n","Naam"],["v","Via","select",AGS()]],{n:old,v:S.ag[old]||AGE},o=>{delete S.ag[old];if(o.v&&o.v!==AGE)S.ag[o.n]=o.v;S.av.forEach(x=>{if(x.n===old)x.n=o.n});S.emp[i]=o.n;save();render()},()=>{delete S.ag[old];S.av=S.av.filter(x=>x.n!==old);S.emp.splice(i,1);save();render()})}}
 else if(d.chk){e.stopPropagation();const[,x]=find(d.chk);x.x=t.checked;popSel=t.checked?`[data-chk="${d.chk}"]`:"";save();render()}
 else if(d.cc){const[g,i]=d.cc.split(":");const it=S.counts[g].items[i];it.done=it.done||{};it.done[mon()]=t.checked;popSel=t.checked?`[data-cc="${d.cc}"]`:"";save();render()}
 else if(d.edit){const[k,x]=find(d.edit);if(x)editItem(k,x)}
 else if(d.new)newItem(d.new);
 else if(d.quick!==undefined)form("Snelle notitie",LISTS.notes.f,{},o=>{S.notes.push(Object.assign({id:uid()},o));save();render()});
 else if(d.grp!==undefined)grp(+d.grp);
 else if(d.newgrp!==undefined)form("Nieuwe telgroep",[["name","Naam"]],{},o=>{S.counts.push({name:o.name,items:[]});save();render()});
});
$("#back").onclick=()=>{if(hDepth>0&&typeof history!=="undefined")history.back();else{view=null;render()}};
init();
if(!nm())setTimeout(askName,2000);

(function(){let busy=false,tm=0;
const ctr=()=>{const st=document.querySelector(".strip");if(st&&st.clientWidth){busy=true;st.style.scrollSnapType="none";st.scrollLeft=st.clientWidth;requestAnimationFrame(()=>{st.style.scrollSnapType="";setTimeout(()=>{busy=false},60)})}};
const o=render;render=function(){const r=o.apply(this,arguments);ctr();return r};
document.addEventListener("scroll",e=>{const st=e.target;if(!st||!st.classList||!st.classList.contains("strip")||busy)return;clearTimeout(tm);tm=setTimeout(()=>{const k=Math.round(st.scrollLeft/st.clientWidth);if(k!==1){const x=fromIso(day);x.setDate(x.getDate()+(k-1)*7);day=iso(x);render()}},130)},true);
ctr();})();
</script>
