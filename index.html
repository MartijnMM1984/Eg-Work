<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--navy:#061a33;--blue:#0f52ba;--green:#61af23;--bg:#f6f8fc;--card:#fff;--tx:#0a1730;--mu:#6b7280;--ln:#dfe5ee;--red:#d64545;--amb:#e0a100}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1218;--card:#141e27;--tx:#edf2f7;--mu:#93a1b1;--ln:#243240;--navy:#060e14}}
:root[data-theme="dark"]{--bg:#0b1218;--card:#141e27;--tx:#edf2f7;--mu:#93a1b1;--ln:#243240;--navy:#060e14}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:76px}
header{background:linear-gradient(90deg,#0d4a98,#1a68b8);color:#fff;padding:14px 16px 12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px}
header b{font-size:20px;flex:1}header b i{font-style:normal;color:var(--green)}
header button{background:none;border:0;color:#fff;font-size:20px;padding:4px 8px;cursor:pointer}
main{max-width:720px;margin:0 auto;padding:14px;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2{margin:4px 0 2px;font-size:22px}.mu{color:var(--mu);font-size:13px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px 14px;margin:10px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;cursor:pointer;text-align:left;color:var(--tx);font:inherit;transition:transform .15s}
.tile:active{transform:scale(.97)}.tile b{display:block;font-size:16px}.tile span{font-size:24px;color:var(--green);font-weight:700}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.btn{background:var(--green);color:#fff;border:0;border-radius:10px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--ln)}.btn.r{background:var(--red)}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--ln);margin:3px 4px 3px 0;font-size:14px;cursor:pointer}
.chip.ziek{background:#fde8e8;color:#a52a2a;border-color:#f3b6b6}.chip.vakantie{background:#fff4d6;color:#8a6500;border-color:#f0d58a}
.pill{font-size:11px;padding:2px 8px;border-radius:99px;color:#fff;background:var(--mu)}.pill.Hoog{background:var(--red)}.pill.Normaal{background:var(--blue)}.pill.Laag{background:var(--green)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav button{flex:1;background:none;border:0;padding:10px 0 8px;color:var(--mu);font:inherit;font-size:12px;cursor:pointer}
nav button.on{color:var(--green);font-weight:700}nav button span{display:block;font-size:20px}
.item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--ln);cursor:pointer}.item:last-child{border:0}
.item input{width:20px;height:20px;accent-color:var(--green);margin-top:2px}.done{text-decoration:line-through;opacity:.55}
#modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal.on{display:flex}#sheet{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px;max-height:88vh;overflow:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 3px}
input[type=text],input[type=date],textarea,select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font:inherit}
.sec{margin:18px 2px 0;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--green)}
.fab{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;font-size:28px;background:var(--green);color:#fff;border:0;box-shadow:0 4px 14px #0004;z-index:7;cursor:pointer}
#st{font-size:11px;opacity:.8}

header b{font-size:26px;font-weight:600;color:#fff;flex:0}header b i{all:unset}.lg{height:38px}
h1{text-align:center;font-size:28px;margin:18px 0 14px}
.datebox{background:var(--card);border:2px solid var(--ln);border-radius:30px;padding:12px;text-align:center;font-weight:600}
.big{border-radius:28px;border-width:2px;padding:16px}.ct{font-size:20px;display:block;margin-bottom:6px}
.wk{text-align:center;margin:6px 0 10px}.strip{display:flex;gap:5px}
.sb{flex:1;min-width:0;border:2px solid var(--ln);background:var(--card);color:var(--tx);border-radius:18px;padding:8px 0;font:inherit;font-size:14px;line-height:1.25;cursor:pointer}
.sb.on{background:#8dc010;border-color:#8dc010;color:#fff;font-weight:700}
h3{margin:14px 0 8px;font-size:19px}
.pr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:16px 14px;border:2px solid var(--ln);border-bottom:2px solid var(--tx);border-radius:18px 18px 0 0;margin-top:-2px;background:var(--bg);cursor:pointer}
.pr b{font-size:17px}.sh{font-size:13px;font-weight:600;color:var(--mu);white-space:nowrap}
.ab{font-size:13px;font-weight:700}.ab.ziek{color:var(--red)}.ab.vakantie{color:var(--amb)}
.bl{line-height:1.6;font-size:16px;color:var(--mu)}
.vp{border:2px solid var(--ln);border-radius:22px;padding:14px;margin-top:12px;cursor:pointer}.vp b{font-size:15px}
.tile{text-align:center;position:relative;border-radius:30px;border-width:2px;padding:20px 8px}.tile b{margin-top:8px;font-size:18px}
.bd{position:absolute;top:12px;right:14px;background:#8dc010;color:#0a1730;border-radius:99px;min-width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-weight:700}
.two{display:flex;gap:10px;margin-top:10px}.two .btn{flex:1;padding:14px;border-radius:20px}
#qn{border-radius:20px;border-width:2px}
.spc{border:2px solid #f0a030;border-radius:28px;padding:16px;background:var(--card);cursor:pointer}
.sp{padding:6px 4px;font-size:18px}.pl{border:2px solid var(--ln);border-radius:99px;padding:6px 14px;font-weight:600;white-space:nowrap}
.bar{height:14px;border-radius:9px;background:#252b35;margin-top:14px;overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#e03c2c,#8dc010)}

<div id="modal"><div id="sheet"></div></div>
<script>
const SH=["Vroeg","Laat","Nacht","Bakery 1","Bakery 2","Tussendienst"];
const DEF={emp:[],cinit:false,rep:{},sp:{t:"SPAR Actie",d:"",e:"",items:[]},vp:[],roster:{},abs:{},todo:[],logs:[],counts:[],visits:[],office:[],notes:[],spar:[],info:""};
const LISTS={
 todo:{t:"To Do",chk:1,f:[["t","Taak"],["p","Prioriteit","select",["Hoog","Normaal","Laag"]],["d","Datum","date"]]},
 logs:{t:"Logboek",f:[["t","Onderwerp"],["w","Medewerker","emp"],["n","Toelichting","area"]],date:1},
 visits:{t:"Bezoeken & afspraken",f:[["t","Wie / wat"],["d","Datum","date"],["n","Notitie","area"]]},
 office:{t:"Takenlijst kantoor",chk:1,f:[["t","Taak"],["d","Datum","date"]]},
 notes:{t:"Notities",f:[["t","Titel"],["n","Notitie","area"]]},
 spar:{t:"SPAR acties",f:[["t","Actie"],["d","Start","date"],["e","Einde","date"],["n","Producten en prijzen","area"]]}
};
let S=JSON.parse(JSON.stringify(DEF)),tab="home",view=null,day=iso(new Date()),db=null,ref=null,tm=null,lastJson="";
const $=q=>document.querySelector(q);
function iso(d){const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)}
function fromIso(s){return new Date(s+"T12:00:00")}
function wk(d){d=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-n);return Math.ceil(((d-Date.UTC(d.getUTCFullYear(),0,1))/864e5+1)/7)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function fd(s){return s?fromIso(s).toLocaleDateString("nl-NL",{weekday:"short",day:"numeric",month:"short"}):""}
const uid=()=>Math.random().toString(36).slice(2,9);
function mon(){return iso(new Date()).slice(0,7)}

/* ---------- opslag ---------- */
function setSt(t){$("#st").textContent=t}
function merge(o){S=Object.assign(JSON.parse(JSON.stringify(DEF)),o||{});if(!S.cinit){if(!S.counts.length)S.counts=["Shop","Bakery","Tabak"].map(name=>({name,items:[]}));S.cinit=true}}
function save(){
 const j=JSON.stringify(S);lastJson=j;
 try{localStorage.setItem("egwork",j)}catch(e){}
 setSt("Opslaan…");clearTimeout(tm);
 tm=setTimeout(async()=>{
  if(!ref){setSt("Alleen op dit apparaat");return}
  try{await ref.set({json:j});setSt("✓ Opgeslagen")}catch(e){setSt("Niet gedeeld")}
 },500);
}
async function init(){
 try{const j=localStorage.getItem("egwork");if(j){merge(JSON.parse(j));lastJson=j}}catch(e){}
 try{const th=localStorage.getItem("egtheme");if(th)document.documentElement.dataset.theme=th}catch(e){}
 render();
 try{
  db=await (window.claude&&claude.use?claude.use("db"):null);
  if(!db){setSt("Alleen op dit apparaat");return}
  ref=db.doc("eg/state");
  ref.onSnapshot(s=>{
   if(s.exists&&s.data().json){
    if(s.metadata.hasPendingWrites)return;
    const j=s.data().json;if(j===lastJson)return;
    lastJson=j;merge(JSON.parse(j));setSt("✓ Gedeeld");if(!$("#modal").classList.contains("on"))render();
   }else if(lastJson&&lastJson!==JSON.stringify(DEF)){save()}
   else setSt("✓ Gedeeld");
  },()=>setSt("Niet gedeeld"));
 }catch(e){setSt("Alleen op dit apparaat")}
}

/* ---------- modal ---------- */
function openM(h){$("#sheet").innerHTML=h;$("#modal").classList.add("on")}
function closeM(){$("#modal").classList.remove("on")}
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeM()});
function form(title,fields,init,cb,del){
 let h=`<h2>${esc(title)}</h2>`;
 fields.forEach(([k,l,t,o])=>{
  const v=init[k]||"";h+=`<label>${esc(l)}</label>`;
  if(t==="area")h+=`<textarea data-k="${k}" rows="4">${esc(v)}</textarea>`;
  else if(t==="date")h+=`<input type="date" data-k="${k}" value="${esc(v)}">`;
  else if(t==="select"||t==="emp"){const op=t==="emp"?["",...S.emp]:o;h+=`<select data-k="${k}">${op.map(x=>`<option ${x===v||(!v&&x==="Normaal"&&k==="p")?"selected":""}>${esc(x)}</option>`).join("")}</select>`}
  else h+=`<input type="text" data-k="${k}" value="${esc(v)}">`;
 });
 h+=`<div class="row" style="margin-top:16px">${del?'<button class="btn r" id="fd">Verwijderen</button>':"<span></span>"}<span><button class="btn g" id="fc">Annuleer</button> <button class="btn" id="fs">Opslaan</button></span></div>`;
 openM(h);
 $("#fc").onclick=closeM;
 if(del)$("#fd").onclick=()=>{if(confirm("Weet je het zeker?")){del();closeM()}};
 $("#fs").onclick=()=>{const o={};document.querySelectorAll("#sheet [data-k]").forEach(e=>o[e.dataset.k]=e.value.trim());if(!(o[fields[0][0]]||"")){return}cb(o);closeM()};
}
function pick(title,opts){openM(`<h2>${esc(title)}</h2>`+opts.map((o,i)=>`<button class="btn ${o[2]||"g"}" style="display:block;width:100%;margin:8px 0" data-i="${i}">${esc(o[0])}</button>`).join(""));
 document.querySelectorAll("#sheet [data-i]").forEach(b=>b.onclick=()=>{closeM();opts[b.dataset.i][1]()})}

/* ---------- schermen ---------- */
function greet(){const h=new Date().getHours();return h<6?"Goedenacht":h<12?"Goedemorgen":h<18?"Goedemiddag":"Goedenavond"}
function working(d){const r=S.roster[d]||{};const s=new Set();SH.forEach(x=>(r[x]||[]).forEach(n=>s.add(n)));return s}
function rosterBody(d,ro){
 const r=S.roster[d]||{},a=S.abs[d]||{};
 return SH.map(s=>{const l=r[s]||[];if(ro&&!l.length)return"";
  return `<div style="margin-top:10px"><div class="row"><b>${s}</b>${ro?"":`<button class="btn g" data-add="${s}">+</button>`}</div>
  ${l.map(n=>`<span class="chip ${a[n]||""}" ${ro?"":`data-who="${s}|${esc(n)}"`}>${esc(n)}${a[n]?" · "+a[n]:""}</span>`).join("")||'<span class="mu">Niemand</span>'}</div>`}).join("")||'<div class="mu">Niemand ingepland.</div>';
}
function Team(){
 return `<div class="row"><h2>Medewerkers</h2><button class="add" data-newemp="1" aria-label="Toevoegen">+</button></div>${S.emp.map((n,i)=>`<div class="ec"><b>${esc(n)}</b><button class="btn g" data-emp="${i}">Wijzig</button></div>`).join("")||'<div class="mu">Nog geen medewerkers. Tik op + om er een toe te voegen.</div>'}`;
}
function Manager(){
 const m=[["visits","◷","Bezoeken & afspraken","Audits, monteurs en andere afspraken"],["office","▤","Takenlijst kantoor","Vaste weektaken van maandag t/m vrijdag"],["counts","□","Tellingen","Tellingen en maandplanning bekijken"],["notes","▱","Notities","Opgeslagen notities openen en beheren"],["roster","▦","Roosters","Werkrooster openen en bekijken"],["info","i","Managerinformatie","De actuele manager briefing bekijken"]];
 return `<h2 style="font-size:22px">Manager</h2><div class="mu">Kantoorwerk en manageroverzichten</div>`+m.map(x=>`<div class="mc" data-go="${x[0]}"><span class="mi">${x[1]}</span><div><b>${x[2]}</b><span class="mu">${x[3]}</span></div><span class="ch">›</span></div>`).join("");
}
function ListV(k){
 const L=LISTS[k],a=S[k].slice().sort((x,y)=>(x.x?1:0)-(y.x?1:0));
 return `<h2>${L.t}</h2><div class="card">${a.map(x=>`<div class="item" data-edit="${k}:${x.id}">${L.chk?`<input type="checkbox" data-chk="${k}:${x.id}" ${x.x?"checked":""}>`:""}<div class="${x.x?"done":""}"><b>${esc(x.t)}</b> ${x.p?`<span class="pill ${x.p}">${x.p}</span>`:""}

function Home(){
 const n=new Date(),sec=t=>`<div class="sec">${t}</div>`,cm=mon(),hi=S.todo.filter(x=>!x.x&&x.p==="Hoog");
 const tl=(k,l,c)=>`<button class="tile" data-go="${k[0]}">${c!==""?`<span class="bd">${c}</span>`:""}${ic(k[1])}<b>${l}</b></button>`;
 return `<h1>${greet()}${nm()?" "+esc(nm()):""} 👋</h1><div class="datebox">📅 ${n.toLocaleDateString("nl-NL",{weekday:"long",day:"numeric",month:"long",year:"numeric"})} &nbsp;|&nbsp; Week ${wk(n)}</div>
 ${sec("Vandaag")}${planning()}${brief()}
 ${sec("Management")}<div class="grid">${tl(["roster","p"],"Wie werkt er",rows(iso(n)).length)}${tl(["logs","l"],"Logboek","")}${tl(["todo","t"],"To Do",S.todo.filter(x=>!x.x).length)}${tl(["counts","c"],"Tellingen",S.counts.reduce((a,g)=>a+g.items.filter(i=>!(i.done||{})[cm]).length,0))}</div>
 ${sec("Aandacht")}<div class="card big"><b class="ct">Extra aandacht</b>${hi.map(x=>`<div class="mu" data-edit="todo:${x.id}" style="cursor:pointer;font-size:13px">• ${esc(x.t)}</div>`).join("")||'<div class="mu">Geen urgente taken.</div>'}</div>
 <div class="card big"><b class="ct">Snelle notitie</b><textarea id="qn" rows="3" placeholder="Schrijf hier een korte notitie..."></textarea><div class="two"><button class="btn g" data-a="qs">Notitie opslaan</button><button class="btn g" data-go="notes">Notities</button></div></div>
 ${sec("Acties")}${sparCard()}`;
}
function Roster(){return `<h2>Wie werkt er</h2>`+planning()}
function Info(){return `<h2>Managerinformatie</h2>`+brief()}
function askName(){form("Jouw naam",[["n","Naam"]],{n:nm()},o=>{try{localStorage.setItem("egname",o.n)}catch(e){}render()})}
function theme(){const r=document.documentElement,dk=getComputedStyle(r).getPropertyValue("--bg").trim()==="#0b1218";r.dataset.theme=dk?"light":"dark";try{localStorage.setItem("egtheme",r.dataset.theme)}catch(e){}}
function spEdit(){
 const w=JSON.parse(JSON.stringify(S.sp));w.items=w.items||[];
 const grab=()=>{w.t=$("#s1").value.trim()||"SPAR Actie";w.d=$("#sd").value;w.e=$("#se").value};
 const draw=()=>{
  openM(`<h2>SPAR Actie</h2><label>Naam</label><input type="text" id="s1" value="${esc(w.t)}"><label>Start</label><input type="date" id="sd" value="${esc(w.d)}"><label>Einde</label><input type="date" id="se" value="${esc(w.e)}"><label>Producten</label>`+
  w.items.map((x,i)=>`<div class="row" style="padding:6px 0"><span>${esc(x.n)} · € ${esc(x.p)}</span><button class="btn r" data-x="${i}">×</button></div>`).join("")+
  `<div class="row" style="margin-top:8px;gap:6px"><input type="text" id="pn" placeholder="Product"><input type="text" id="pp" placeholder="Prijs" style="width:90px"><button class="btn" id="pa">+</button></div><div class="row" style="margin-top:16px"><button class="btn g" id="sc">Annuleer</button><button class="btn" id="ss">Opslaan</button></div>`);
  document.querySelectorAll("#sheet [data-x]").forEach(b=>b.onclick=()=>{grab();w.items.splice(+b.dataset.x,1);draw()});
  $("#pa").onclick=()=>{grab();const n=$("#pn").value.trim();if(!n)return;w.items.push({n,p:$("#pp").value.trim().replace(",",".")});draw()};
  $("#sc").onclick=closeM;$("#ss").onclick=()=>{grab();S.sp=w;save();render();closeM()};
 };draw();
}
document.addEventListener("click",e=>{
 const t=e.target.closest("[data-a]");if(!t)return;const[a,...r]=t.dataset.a.split(":"),v=r.join(":");
 if(a==="day"){day=v;render()}
 else if(a==="wk"){const x=fromIso(day);x.setDate(x.getDate()+ +v);day=iso(x);render()}
 else if(a==="menu")pick("Menu",[["Medewerkers beheren",()=>{tab="team";view=null;render()}],["Telgroepen beheren",()=>{view="counts";render()}],["Mijn naam wijzigen",askName],["Donker / licht",theme]]);
 else if(a==="padd"){if(!S.emp.length){alert("Voeg eerst medewerkers toe via het menu (Medewerkers beheren).");return}
  form("Medewerker inplannen",[["n","Medewerker","emp"],["s","Dienst","select",SH]],{s:"Vroeg"},o=>{ensure(day,o.s);if(!S.roster[day][o.s].includes(o.n))S.roster[day][o.s].push(o.n);save();render()})}
 else if(a==="row"){const[d,s,...q]=v.split("|"),n=q.join("|");S.abs[d]=S.abs[d]||{};S.rep[d]=S.rep[d]||{};
  pick(n,[["Ziek",()=>{S.abs[d][n]="ziek";save();render()}],["Vakantie",()=>{S.abs[d][n]="vakantie";save();render()}],
   ["Vervanger kiezen",()=>form("Vervanger voor "+n,[["r","Vervanger","emp"]],{r:S.rep[d][n]||""},o=>{S.rep[d][n]=o.r;save();render()})],
   ["Aanwezig",()=>{delete S.abs[d][n];delete S.rep[d][n];save();render()}],
   ["Van rooster halen",()=>{S.roster[d][s]=S.roster[d][s].filter(x=>x!==n);delete S.abs[d][n];delete S.rep[d][n];save();render()},"r"]])}
 else if(a==="qs"){const q=$("#qn").value.trim();if(!q)return;S.notes.push({id:uid(),t:q.slice(0,40),n:q,c:iso(new Date())});save();render();setSt("✓ Notitie opgeslagen")}
 else if(a==="sp")spEdit();
 else if(a==="vp"){const l=S.vp[S.vp.length-1];form("Villa Pardoes: maandelijkse afslag",[["d","Datum afgeslagen","date"]],{d:iso(new Date())},o=>{S.vp.push(o.d);S.vp.sort();save();render()},l?()=>{S.vp.pop();save();render()}:null)}
});

let cM=mon(),cG=0;
const mlab=m=>{const[y,q]=m.split("-");return new Date(+y,+q-1,1).toLocaleDateString("nl-NL",{month:"long",year:"numeric"}).replace(/^./,c=>c.toUpperCase())};
const cdate=v=>typeof v==="string"&&v.length>6?"✓ "+v.split("-").reverse().join("-"):"✓ Geteld";
function Counts(){
 if(cG>=S.counts.length)cG=0;const g=S.counts[cG],it=g?g.items:[],dn=it.filter(i=>(i.done||{})[cM]).length;
 return `<h2>Tellingen</h2><div class="mbar"><button class="sq" data-a="cm:-1">‹</button><b>${mlab(cM)}</b><button class="sq" data-a="cm:1">›</button></div>
 <div class="seg">${S.counts.map((x,i)=>`<button class="${i===cG?"on":""}" data-a="cg:${i}">${esc(x.name)}</button>`).join("")}</div>
 <h3 style="margin:14px 2px 8px">Subcategorieën</h3>
 ${g?`<div class="card pc">${esc(g.name)}: ${dn} van ${it.length} ingevulde subcategorieën gedaan<div class="pb"><i style="width:${it.length?dn/it.length*100:0}%"></i></div></div>
 ${it.map((x,i)=>{const v=(x.done||{})[cM];return `<div class="ci"><span>${esc(x.n)}</span><button class="cb ${v?"d":""}" data-a="ci:${i}">${v?cdate(v):"Telling gedaan"}</button></div>`}).join("")||'<div class="mu">Nog geen subcategorieën. Voeg ze toe met de knop hieronder.</div>'}
 <div class="two"><button class="btn g" data-a="cadd">+ Subcategorie</button><button class="btn g" data-a="cbeh">Beheer</button></div>`:""}`;
}
function cEdit(i){
 const x=S.counts[cG].items[i],cur=x.done[cM],dv=typeof cur==="string"&&cur.length>6?cur:iso(new Date());
 openM(`<h2 style="text-align:center">Telling aanpassen</h2><div style="text-align:center;margin:4px 0 14px">${esc(x.n)}</div><label class="dtb" style="margin:0">Datum: <input type="date" id="cd" value="${dv}"></label><div class="two"><button class="btn g" id="cx">Annuleren</button><button class="btn g" id="cs">Opslaan</button></div><button class="btn g" id="co" style="width:100%;margin-top:10px;padding:10px">Weer open zetten</button>`);
 $("#cx").onclick=closeM;
 $("#cs").onclick=()=>{const v=$("#cd").value;if(v){x.done[cM]=v;save();render()}closeM()};
 $("#co").onclick=()=>{delete x.done[cM];save();render();closeM()};
}
document.addEventListener("click",e=>{
 const t=e.target.closest("[data-a]");if(!t)return;const[a,v]=t.dataset.a.split(":");
 if(a==="cm"){const[y,q]=cM.split("-"),d=new Date(+y,+q-1+ +v,1);cM=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");render()}
 else if(a==="cg"){cG=+v;render()}
 else if(a==="ci"){const x=S.counts[cG].items[+v];x.done=x.done||{};
  if(x.done[cM])cEdit(+v);else{x.done[cM]=cM===mon()?iso(new Date()):cM+"-01";save();render()}}
 else if(a==="cadd")form("Nieuwe subcategorie",[["n","Naam"]],{},o=>{S.counts[cG].items.push({n:o.n,done:{}});save();render()});
 else if(a==="cbeh")grp(cG);
});

function render(){
 let h;
 if(view==="roster")h=Roster();else if(view==="counts")h=Counts();else if(view==="info")h=Info();
 else if(view&&LISTS[view])h=ListV(view);
 else h=tab==="home"?Home():tab==="team"?Team():Manager();
 $("#app").innerHTML=h;$("#back").hidden=!view;
 $("#nav").innerHTML=[["home","⌂","Home"],["team","☺","Team"],["manager","▣","Manager"]].map(x=>`<button data-tab="${x[0]}" class="${!view&&tab===x[0]?"on":""}"><span>${x[1]}</span>${x[2]}</button>`).join("");
 const i=$("#info");if(i)i.oninput=()=>{S.info=i.value;save()};
}

/* ---------- acties ---------- */
const find=s=>{const[k,id]=s.split(":");return[k,S[k].find(x=>x.id===id)]};
function editItem(k,x){const L=LISTS[k];form(L.t,L.f,x,o=>{Object.assign(x,o);save();render()},()=>{S[k]=S[k].filter(y=>y!==x);save();render()})}
function newItem(k){const L=LISTS[k];form("Nieuw – "+L.t,L.f,{},o=>{S[k].push(Object.assign({id:uid(),c:iso(new Date())},o));save();render()})}
function ensure(d,s){S.roster[d]=S.roster[d]||{};S.roster[d][s]=S.roster[d][s]||[]}
function grp(gi){
 const g=S.counts[gi];
 pick(g.name,[["Naam wijzigen",()=>form("Groep",[["name","Naam"]],g,o=>{g.name=o.name;save();render()})],["Vak toevoegen",()=>form("Vak",[["n","Naam"]],{},o=>{g.items.push({n:o.n,done:{}});save();render()})],
  ...g.items.map((it,ii)=>["Verwijder vak: "+it.n,()=>{g.items.splice(ii,1);save();render()},"r"]),
  ["Groep verwijderen",()=>{if(confirm("Hele groep verwijderen?")){S.counts.splice(gi,1);save();render()}},"r"]]);
}
document.addEventListener("click",e=>{
 const t=e.target.closest("[data-tab],[data-go],[data-day],[data-set],[data-add],[data-who],[data-emp],[data-newemp],[data-edit],[data-new],[data-quick],[data-cc],[data-chk],[data-grp],[data-newgrp]");
 if(!t)return;const d=t.dataset;
 if(d.tab){tab=d.tab;view=null;render();scrollTo(0,0)}
 else if(d.go){view=d.go;render();scrollTo(0,0)}
 else if(d.day){const x=fromIso(day);x.setDate(x.getDate()+ +d.day);day=iso(x);render()}
 else if(d.set){day=d.set;render()}
 else if(d.add){const s=d.add;ensure(day,s);const free=S.emp.filter(n=>!S.roster[day][s].includes(n));
  if(!S.emp.length){alert("Voeg eerst medewerkers toe bij Team.");return}
  pick("Voeg toe aan "+s,free.map(n=>[n,()=>{S.roster[day][s].push(n);save();render()}]))}
 else if(d.who){const[s,n]=d.who.split("|");S.abs[day]=S.abs[day]||{};
  pick(n,[["Ziek melden",()=>{S.abs[day][n]="ziek";save();render()}],["Vakantie",()=>{S.abs[day][n]="vakantie";save();render()}],["Aanwezig",()=>{delete S.abs[day][n];save();render()}],["Van dienst halen",()=>{S.roster[day][s]=S.roster[day][s].filter(x=>x!==n);save();render()},"r"]])}
 else if(d.newemp!==undefined)form("Nieuwe medewerker",[["n","Naam"]],{},o=>{S.emp.push(o.n);save();render()});
 else if(d.emp!==undefined){const i=+d.emp;form("Medewerker",[["n","Naam"]],{n:S.emp[i]},o=>{S.emp[i]=o.n;save();render()},()=>{S.emp.splice(i,1);save();render()})}
 else if(d.chk){e.stopPropagation();const[,x]=find(d.chk);x.x=t.checked;save();render()}
 else if(d.cc){const[g,i]=d.cc.split(":");const it=S.counts[g].items[i];it.done=it.done||{};it.done[mon()]=t.checked;save();render()}
 else if(d.edit){const[k,x]=find(d.edit);if(x)editItem(k,x)}
 else if(d.new)newItem(d.new);
 else if(d.quick!==undefined)form("Snelle notitie",LISTS.notes.f,{},o=>{S.notes.push(Object.assign({id:uid()},o));save();render()});
 else if(d.grp!==undefined)grp(+d.grp);
 else if(d.newgrp!==undefined)form("Nieuwe telgroep",[["name","Naam"]],{},o=>{S.counts.push({name:o.name,items:[]});save();render()});
});
$("#back").onclick=()=>{view=null;render()};
init();
if(!nm())setTimeout(askName,600);
</script>
</body>
</html>
